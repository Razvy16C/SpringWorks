<!doctype html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SpringWorks</title>

<!-- Fonts-->
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Prompt:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- Styles -->
<link rel="stylesheet" href="css/stil.css">

</head>
<body>
<div id="app">
  <header>
    <div class="marca">Spring<i>Works</i></div>
    <div class="grup">
      <button id="btnPlay" class="principal"><span class="ico ico-play" aria-hidden="true"></span> Simulate</button>
      <button id="btnUndo" title="Ctrl+Z"><span class="ico ico-undo" aria-hidden="true"></span> Undo</button>
      <button id="btnMeniu" class="doar-tactil" aria-label="Menu"><span class="ico ico-menu" aria-hidden="true"></span> Menu</button>
      <div id="meniu">
      <button id="btnSalveaza"><span class="ico ico-save" aria-hidden="true"></span> Save</button>
      <button id="btnIncarca"><span class="ico ico-load" aria-hidden="true"></span> Load</button>
      <button id="btnExemplu"><span class="ico ico-example" aria-hidden="true"></span> Example car</button>
      <button id="btnGoleste"><span class="ico ico-clear" aria-hidden="true"></span> Clear parts</button>
      <button id="btnSunet"><span class="ico ico-sound" aria-hidden="true"></span>Sound</button>
      </div>
    </div>
  </header>

  <aside id="inventar">
    <button class="inchide doar-tactil"><span class="ico ico-close" aria-hidden="true"></span> Close</button>
    <h2>Inventory</h2>
    <p class="nota">Tap or drag a part into the scene.</p>
    <div id="listaInventar"></div>
  </aside>

  <main>
    <div id="unelte" class="grup">
      <button data-unealta="muta" title="1">Move</button>
      <button data-unealta="leaga" title="2">Connect</button>
      <button data-unealta="teren" title="3">Terrain</button>
      <select id="tipPrindere" hidden aria-label="Tip prindere">
        <option value="rigid">Rigid joint</option>
        <option value="pivot">Pivot joint</option>
      </select>
      <select id="pensula" hidden aria-label="Terrain brush">
        <option value="ridica">Raise</option>
        <option value="coboara">Lower</option>
        <option value="netezeste">Smooth</option>
        <option value="niveleaza">Level</option>
        <option value="deseneaza">Draw platform</option>
        <option value="sterge">Erase platform</option>
      </select>
      <label id="marimeLabel" hidden>Brush <input id="marime" type="range" min="1" max="10" step="0.5" value="3"></label>
      <button id="btnTerenPlat" hidden>Flat terrain</button>
      <button id="btnTerenNou" hidden>New terrain</button>
    </div>
    <div id="scena">
      <canvas id="panza" aria-label="Game scene"></canvas>
      <div id="indiciu" role="status"></div>
      <div id="actiuni" class="doar-tactil" hidden>
        <button data-actiune="rotesteStanga" aria-label="Rotate left"><span class="ico ico-rotate-left" aria-hidden="true"></span><small>Rotate</small></button>
        <button data-actiune="rotesteDreapta" aria-label="Rotate right"><span class="ico ico-rotate-right" aria-hidden="true"></span><small>Rotate</small></button>
        <button data-actiune="copiaza"><span class="ico ico-copy" aria-hidden="true"></span><small>Copy</small></button>
        <button data-actiune="desprinde"><span class="ico ico-cut" aria-hidden="true"></span><small>Disconnect</small></button>
        <button data-actiune="sterge"><span class="ico ico-delete" aria-hidden="true"></span><small>Delete</small></button>
        <button id="btnReglaje"><span class="ico ico-gear" aria-hidden="true"></span><small>Settings</small></button>
      </div>
      <div id="condus" hidden>
        <button id="inapoi" aria-label="Backward"><span class="ico ico-arrow-left" aria-hidden="true"></span></button>
        <button id="inainte" aria-label="Forward"><span class="ico ico-arrow-right" aria-hidden="true"></span></button>
      </div>
      <div id="vedere" class="grup">
        <button id="btnPlus" aria-label="Zoom in">+</button>
        <button id="btnMinus" aria-label="Zoom out">−</button>
        <button id="btnCentru">Center</button>
      </div>
    </div>
  </main>

  <nav id="bara" class="doar-tactil" aria-label="Tools">
    <button data-unealta="muta"><span class="ico ico-move" aria-hidden="true"></span><small>Move</small></button>
    <button data-unealta="leaga"><span class="ico ico-link" aria-hidden="true"></span><small>Connect</small></button>
    <button data-unealta="teren"><span class="ico ico-terrain" aria-hidden="true"></span><small>Terrain</small></button>
    <button id="btnPiese"><span class="ico ico-parts" aria-hidden="true"></span><small>Parts</small></button>
    <button id="btnLume"><span class="ico ico-gear" aria-hidden="true"></span><small>Settings</small></button>
  </nav>

  <aside id="proprietati">
    <button class="inchide doar-tactil">Close</button>
    <div id="panou"></div>
    <section>
      <h2>World</h2>
      <label class="camp">Gravity
        <select id="gravitatie">
          <option value="9.81">Earth · 9.81 m/s²</option>
          <option value="274">Soare · 274 m/s²</option>
          <option value="1.62">Moon · 1.62 m/s²</option>
          <option value="3.72">Mars · 3.72 m/s²</option>
          <option value="24.79">Jupiter · 24,79 m/s²</option>
          <option value="0">Zero · 0 m/s²</option>
        </select>
      </label>
      <label class="camp">Terrain friction <output id="frecareTerenV"></output>
        <input id="frecareTeren" type="range" min="0" max="2" step="0.05">
      </label>
      <label class="camp">Sound volume
        <input id="volum" type="range" min="0" max="1" step="0.05">
      </label>
      <label class="bifa"><input id="urmareste" type="checkbox" checked> Camera follows selected part</label>
    </section>
  </aside>
</div>
<script src="js/blocks.js"></script>
<script src="js/config.js"></script>
<script src="vendor/planck.min.js"></script>
<script src="js/model.js"></script>
<script src="js/teren.js"></script>
<script src="js/fizica.js"></script>
<script src="js/randare.js"></script>
<script src="js/interfata.js"></script>
<script src="js/interactiune.js"></script>
<script src="js/sunet.js"></script>
<script src="js/tactil.js"></script>
<script src="js/main.js"></script>
</body>
</html>
